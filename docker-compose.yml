# AgentHub 容器部署（NAS 常驻：持续领积分 + 提供模型服务）
#
# NAS 上的路径对应关系（群晖）：/volume1/docker/AgentHub ←→ Windows 的 Z:\AgentHub
# 首次部署：
#   mkdir -p /volume1/docker/AgentHub/data
#   docker compose up -d --build
# 访问：http://<NAS-IP>:9528
#
# 两个端口：
#   9528  Web 控制台（浏览器访问与配置）
#   9527  反代网关（OpenAI 兼容）——把 AI 客户端的 base_url 指到这里
#
# 关于「持续领积分」：AgentHub 自带定时签到（checkinAuto），容器里由
# AGENTHUB_CHECKIN_AUTO 打开。签到按**本地时间**判定，故 TZ 必须正确，
# 否则 09:00 会变成别的时刻、跨零点还可能错判「今天已跑」。
services:
  agenthub:
    build: .
    image: agenthub-web
    container_name: agenthub
    restart: unless-stopped
    ports:
      # 端口内外保持一致，前端才能用浏览器地址栏的 host 推导出正确的网关地址。
      # 若宿主机的 9527/9528 被占用（如群晖的 syslog-ng 占了 9526-9529 段），
      # 改这两组数字即可（例如 19528:19528 / 19527:19527），并同步改下面
      # AGENTHUB_WEB_PORT / AGENTHUB_PROXY_PORT，三者要一致。
      - "9528:9528"   # Web 控制台
      - "9527:9527"   # 反代网关（模型服务）
      # SSH（可选）：容器内排查用。左侧是宿主机端口，按需改；不设公钥时 sshd 不会启动。
      # 比在 NAS 上走 sudo 安全：容器内的 root 被命名空间隔离，碰不到 NAS 本体与其它服务。
      - "12222:22"
    environment:
      # ---- Web 控制台 ----
      AGENTHUB_WEB_PORT: "9528"
      AGENTHUB_WEB_HOST: "0.0.0.0"
      # 留空 = 不鉴权。暴露到非可信网络时**务必**设置一个长随机串
      # AGENTHUB_WEB_TOKEN: "换成你的随机口令"

      # ---- 反代网关 ----
      # 网关监听端口（与上面 ports 的右侧数字一致）
      AGENTHUB_PROXY_PORT: "9527"

      # ---- SSH（可选）----
      # 填公钥内容即启用；不填则不启动 sshd。仅密钥登录，不支持密码。
      # 公钥会持久化到 /data/ssh/authorized_keys，之后改这里也以数据目录里的为准。
      # AGENTHUB_SSH_PUBKEY: "ssh-ed25519 AAAA... you@host"

      # ---- 数据落盘（compose 里挂到 NAS）----
      AGENTHUB_DATA_DIR: "/data"
      AGENTHUB_DATA_MOUNT: "/data"

      # ---- 时区：签到按本地时间判定，务必与你的作息一致 ----
      TZ: "Asia/Shanghai"

      # ---- 容器适配（不改桌面端默认行为，只在此处覆盖）----
      # 网关监听地址：容器内必须 0.0.0.0，否则外部连不上
      AGENTHUB_PROXY_BIND: "0.0.0.0"
      # 容器重启后自动恢复网关服务（桌面端语义是「上次退出时的开关状态」，默认关）
      AGENTHUB_PROXY_AUTOSTART: "1"
      # 定时签到：持续领积分
      AGENTHUB_CHECKIN_AUTO: "1"
      AGENTHUB_CHECKIN_TIME: "09:00"
      # 额度刷新间隔（分钟）
      AGENTHUB_CREDITS_REFRESH_MIN: "30"
      # 网关对外接入地址里的 host（给 AI 客户端填的那个地址）。
      # 不设时：浏览器访问控制台会自动用地址栏的 host 推导（多数情况够用）；
      # 但用 CLI/脚本读 API 拿到的会是 127.0.0.1，此时建议显式指定 NAS 的 IP 或域名。
      # 换成你自己的 NAS 地址；用域名/反代的话填那个域名
      AGENTHUB_PUBLIC_HOST: "192.168.1.172"
    volumes:
      # 全部数据（配置 / 用量库 / 号池 / 记忆仓库 / 网关统计）落 NAS。
      # 相对路径在 NAS 上即 /volume1/docker/AgentHub/data（= Z:\AgentHub\data）
      - ./data:/data
      # 时区文件：让容器内时间与宿主一致（TZ 之外的双保险）。
      # 注意各发行版路径不同：群晖是 /etc/TZ，多数 Linux 是 /etc/localtime。
      # 挂一个**不存在**的路径会让容器直接起不来，所以这里只挂 localtime，
      # 群晖用户若报 mount 错误，把它改成 `- /etc/TZ:/etc/TZ:ro` 或直接删掉这行
      # （镜像里已用 TZ 环境变量 + tzdata 设好时区，这行只是双保险）。
      - /etc/localtime:/etc/localtime:ro
      # 如需读取本机 AI 客户端的历史用量明细，取消注释（仅同构 Linux 宿主机有意义）
      # - ~/.config:/root/.config:ro
      # - ~/.local/share:/root/.local/share:ro
    healthcheck:
      # 用 shell 形式从环境变量取端口：改 AGENTHUB_WEB_PORT 时健康检查跟着走，
      # 不必再改一次（之前硬编码 9528，换端口后容器一直是 unhealthy 却仍在正常服务）
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${AGENTHUB_WEB_PORT:-9528}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
